const nodes = mesh.nodes;

  const pr = [], pg = [], pb = [];

    const cx = (A[o] + A[o + 3] + A[o + 6]) / 3, cz = (A[o + 2] + A[o + 5] + A[o + 8]) / 3; const s = (cx - ax) * tx + (cz - az) * tz, d = (cx - ax) * nx + (cz - az) * nz; if (s < 0 || s > L || d < 0.8 || d > 4.5) continue;
    const ux = A[o + 3] - A[o], uy = A[o + 4] - A[o + 1], uz = A[o + 5] - A[o + 2], vx = A[o + 6] - A[o], vy = A[o + 7] - A[o + 1], vz = A[o + 8] - A[o + 2]; const cyn = uz * vx - ux * vz, l = Math.hypot(uy * vz - uz * vy, cyn, ux * vy - uy * vx) || 1; if (Math.abs(cyn) / l < 0.85) continue;

  let cover = 0, wallTri = 0;
  for (const nd of rows) { const A = P(nd), n = A.length / 9; for (let i = 0; i < n; i++) { const o = i * 9;
    const cy = (A[o + 1] + A[o + 4] + A[o + 7]) / 3; if (cy < g + 3 || cy > g + H - 0.3) continue;
    const cx = (A[o] + A[o + 3] + A[o + 6]) / 3, cz = (A[o + 2] + A[o + 5] + A[o + 8]) / 3; const s = (cx - ax) * tx + (cz - az) * tz, d = (cx - ax) * nx + (cz - az) * nz; if (s < 0 || s > L || d < -3 || d > 3) continue;
    const ux = A[o + 3] - A[o], uy = A[o + 4] - A[o + 1], uz = A[o + 5] - A[o + 2], vx = A[o + 6] - A[o], vy = A[o + 7] - A[o + 1], vz = A[o + 8] - A[o + 2]; const cxn = uy * vz - uz * vy, cyn = uz * vx - ux * vz, czn = ux * vy - uy * vx; const l = Math.hypot(cxn, cyn, czn) || 1;

}
// ---- render one run
function renderRun(it, run, ri, st) {

  const L = run.len; const H = it.h + 1.2; const PX = 0.1; let w = Math.round(L / PX), h = Math.round((H + 1.0) / PX); let sc = 1; if (w > 3000) { sc = 3000 / w; w = 3000; }

  const cam = new THREE.OrthographicCamera(0, -L0, H - 0.5 + 0.5, -(0.5), 0.1, 80); // camera x = -u (looking from outside), left=0,right=-L: column <-> u increasing

function renderRoof(it, g) {

// ---- main loop
const meta = { createdBy: 'tools/sampling/measure.html', s0: S0, s1: S1, rad: RAD, buildings: [] }; let nRun = 0, nRoof = 0; const tStart = performance.now();

    if (run.len >= 2.4) {
      const ax = it.x + run.a[0], az = it.z + run.a[1], bx = it.x + run.b[0], bz = it.z + run.b[1], L0 = Math.hypot(bx - ax, bz - az) || 1;
      const st = stripStats(ax, az, (bx - ax) / L0, (bz - az) / L0, run.nx, run.nz, L0, it.h + 1, 0); Object.assign(R, { g: st.g, d0: st.d0, cover: st.cover, pave: st.pave, nPave: st.nPave, share: st.share, nGround: st.nGround, wallTri: st.wallTri });
      if (st.wallTri > 5 && st.cover > 0.04) { const r = renderRun(it, run, ri, st); R.w = r.w; R.h = r.h; R.px = 0.1 * (run.len / 0.1 / r.w); R.H = it.h + 1.2; R.imgBottom = -0.5; await save(`rect/${it.id}_${ri}.png`, await toPng(r.bufs[0], r.w, r.h)); await save(`rect/${it.id}_${ri}_d.png`, await toPng(r.bufs[1], r.w, r.h)); nRun++; }
