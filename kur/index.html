<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12263a" />
  <title>Kur es esmu? — Rīga</title>
  <meta name="description" content="Kur es esmu? / Where am I? A location-guessing game in a 3D low-poly Riga: look around a street, find the spot on the map. Prototype of BEDRE — Rīga." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>html, body { margin: 0; height: 100%; background: #12263a; }</style>
</head>
<body>
  <canvas id="c" aria-label="3D street view"></canvas>

  <!-- in-round HUD -->
  <div id="hud" class="hidden">
    <div class="chip" id="round-chip"></div>
    <div id="compass" title="N" aria-label="Compass"><svg viewBox="0 0 48 48" width="46" height="46"><circle cx="24" cy="24" r="22" fill="rgba(18,38,58,.72)" stroke="#f6f0e1" stroke-width="1.5"/><g id="compass-needle"><path d="M24 6 L29 24 L24 21 L19 24 Z" fill="#f2a81d"/><path d="M24 42 L29 24 L24 27 L19 24 Z" fill="#f6f0e1" opacity=".75"/><text x="24" y="16.5" text-anchor="middle" font-size="7.5" font-weight="800" fill="#12263a" font-family="system-ui, sans-serif">N</text></g></svg></div>
    <div class="chip" id="timer-chip"></div>
  </div>
  <div id="nav" class="hidden">
    <button id="step-fwd" class="rbtn" type="button" data-i18n-title="fwd"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5 L20 17 H4 Z" fill="currentColor"/></svg></button>
    <button id="step-bwd" class="rbtn" type="button" data-i18n-title="bwd"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 19 L4 7 H20 Z" fill="currentColor"/></svg></button>
  </div>
  <button id="open-map" class="hidden" type="button"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M3 6 L9 4 L15 6 L21 4 V18 L15 20 L9 18 L3 20 Z M9 4 V18 M15 6 V20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span data-i18n="map">Karte</span><i id="pin-dot" class="hidden"></i></button>
  <div id="hint" class="hidden"></div>
  <div id="toast" class="hidden"></div>

  <!-- the 2D guess map -->
  <aside id="mappanel" class="hidden" aria-label="Map">
    <header>
      <span id="map-title"></span>
      <button id="close-map" class="xbtn" type="button" data-i18n-title="closeMap">×</button>
    </header>
    <div class="mapwrap">
      <canvas id="mapc"></canvas>
      <div id="area-chip" class="hidden"></div>
      <div class="zoom"><button id="zin" type="button" data-i18n-title="zoomIn">+</button><button id="zout" type="button" data-i18n-title="zoomOut">−</button></div>
      <div class="mapcredit">© OpenStreetMap · RVP · LĢIA</div>
    </div>
    <div id="guessbar">
      <span id="guess-hint"></span>
      <button id="confirm" class="primary" type="button" disabled data-i18n="confirm">Apstiprināt</button>
    </div>
    <div id="reveal" class="hidden">
      <div class="score"><b id="rv-pts">0</b><small data-i18n="points">punkti</small></div>
      <div class="info">
        <div class="dist"><span data-i18n="distance">Attālums</span> <b id="rv-dist"></b></div>
        <div class="where" id="rv-where"></div>
        <div class="area" id="rv-area"></div>
      </div>
      <button id="next" class="primary" type="button"></button>
    </div>
  </aside>

  <!-- start card -->
  <section id="start" class="card-wrap">
    <div class="card">
      <div class="logo"><svg viewBox="0 0 40 52" width="34" height="44" aria-hidden="true"><path d="M20 50 C20 50 4 31 4 19 a16 16 0 0 1 32 0 C36 31 20 50 20 50Z" fill="#0f7b6c" stroke="#f6f0e1" stroke-width="2.5"/><circle cx="20" cy="19" r="6.5" fill="#f6f0e1"/></svg></div>
      <h1 data-i18n="title">Kur es esmu?</h1>
      <p class="tag" data-i18n="tagline"></p>
      <p class="how" data-i18n="how"></p>
      <div class="opts">
        <div class="row"><span class="lbl" data-i18n="diff">Grūtība</span>
          <div class="seg" id="seg-diff" role="group">
            <button type="button" data-d="easy" data-i18n="easy">Viegli</button><button type="button" data-d="normal" data-i18n="normal">Parasti</button><button type="button" data-d="hard" data-i18n="hard">Grūti</button>
          </div>
        </div>
        <div class="diffhint" id="diff-hint"></div>
        <label class="chk"><input type="checkbox" id="opt-timer" /> <span data-i18n="timer">60 s uz raundu</span></label>
      </div>
      <div id="loadrow"><div class="lbar"><div class="lfill" id="load-fill"></div></div><div id="load-msg"></div></div>
      <button id="play" class="primary big hidden" type="button" data-i18n="play">Spēlēt</button>
      <div class="langrow"><button type="button" data-lang="lv">LV</button><button type="button" data-lang="en">EN</button></div>
      <p class="foot"><span data-i18n="footer">Prototips</span> · <a href="/" data-i18n="mainLink">BEDRE — Rīga</a><br /><span data-i18n="credits"></span></p>
    </div>
  </section>

  <!-- summary -->
  <section id="summary" class="card-wrap hidden">
    <div class="card wide">
      <h2 data-i18n="summary">Rezultāts</h2>
      <div class="big-total"><b id="sum-total">0</b><span><span data-i18n="of">no</span> 25 000</span></div>
      <div class="best" id="sum-best"></div>
      <div class="btnrow">
        <button id="share" type="button" class="ghost" data-i18n="share">Kopīgot rezultātu</button>
        <button id="again" type="button" class="primary" data-i18n="again">Spēlēt vēlreiz</button>
      </div>
      <ol id="sum-rounds"></ol>
      <p class="foot"><span data-i18n="footer">Prototips</span> · <a href="/" data-i18n="mainLink">BEDRE — Rīga</a><br /><span data-i18n="credits"></span></p>
    </div>
  </section>

  <script type="module" src="/src/proto/kur/main.js"></script>
</body>
</html>
